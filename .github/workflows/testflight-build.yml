# Builds one of the apps in this repo (WordPop or GeoPop) on a GitHub Mac
# and uploads it to TestFlight, the same way MathPop does. Called by
# testflight-wordpop.yml and testflight-geopop.yml.
#
# Signing is automatic: Xcode uses the App Store Connect API key in this
# repo's secrets to fetch the certificate and profile it needs.
# Secrets (Settings -> Secrets and variables -> Actions), the same three
# MathPop uses:
#   ASC_KEY_ID     App Store Connect API key ID
#   ASC_ISSUER_ID  Issuer ID shown above the keys list
#   ASC_KEY_P8     Contents of the AuthKey_<id>.p8 file (Admin access)
name: TestFlight build

on:
  workflow_call:
    inputs:
      app:
        description: Folder of the app (wordpop or geopop)
        type: string
        required: true
      name:
        description: The app's name in App Store Connect
        type: string
        required: true

env:
  TEAM_ID: 6W8Q724D5F
  # TestFlight needs each upload's build number to be higher than the
  # last; raise this if builds are ever uploaded by hand from Xcode.
  BUILD_NUMBER_OFFSET: 0

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    # One upload at a time across both apps: each build clears out the
    # signing certificates earlier builds left behind, which mustn't
    # happen while another build is signing.
    concurrency:
      group: apps-testflight
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ inputs.app }}/package-lock.json

      # The ~63MB speech voice is downloaded once and reused.
      - uses: actions/cache@v4
        with:
          path: ${{ inputs.app }}/.ios-assets-cache
          key: ios-assets-${{ hashFiles(format('{0}/scripts/copy-ios-assets.mjs', inputs.app)) }}

      # Pasting the key (especially on a phone) can join its lines, add
      # spaces, or turn the ----- around BEGIN/END into "smart" dashes.
      # Rebuild a clean PEM from whatever base64 is in the secret. Prints
      # only sizes, never the key.
      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          python3 - "$RUNNER_TEMP/keys/AuthKey.p8" <<'PY'
          import base64, os, re, sys, textwrap
          raw = os.environ.get('ASC_KEY_P8', '')
          if not raw.strip():
              sys.exit('::error::This repo has no ASC_KEY_P8 secret yet. Add ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (the same as MathPop) in Settings -> Secrets and variables -> Actions.')
          body = re.sub(r'(BEGIN|END)\s*PRIVATE\s*KEY', '', raw)
          body = re.sub(r'[^A-Za-z0-9+/=]', '', body)
          try:
              der = base64.b64decode(body, validate=True)
          except Exception as err:
              der = b''
              print(f'Key is not valid base64: {err}')
          print(f'Secret length {len(raw)}, base64 chars {len(body)}, decoded bytes {len(der)} (an Apple key is about 149)')
          if len(der) < 100:
              sys.exit('ASC_KEY_P8 does not look like a complete .p8 key. Paste the whole file again.')
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(textwrap.wrap(body, 64)) + '\n-----END PRIVATE KEY-----\n'
          with open(sys.argv[1], 'w') as f:
              f.write(pem)
          PY

      - name: Register the bundle ID and check the App Store Connect app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 ../.github/scripts/check_app_record.py "$RUNNER_TEMP/keys/AuthKey.p8" "com.marikalam.${{ inputs.app }}" "${{ inputs.name }}"

      - run: npm ci

      - name: Build the web app and copy it into the iOS project
        run: npm run build:ios

      # Each build's Mac makes a new development certificate that can't be
      # reused once the machine is gone; Apple allows only a few, so clear
      # out the earlier builds' ones first (see the script).
      - name: Revoke development certificates left by earlier builds
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 ../.github/scripts/revoke_ci_dev_certs.py "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          BUILD_NUMBER=$((BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER))
          echo "Build number: $BUILD_NUMBER"
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the API key
        if: always()
        working-directory: .
        run: rm -rf "$RUNNER_TEMP/keys"
