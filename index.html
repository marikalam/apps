<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marika's Apps</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
    <style>
      :root {
        --bg: #f2f4f9;
        --card-bg: #ffffff;
        --ink: #171a2b;
        --ink-dim: #7a8099;
        --shadow: 0 10px 24px -12px rgba(23, 26, 43, 0.18), 0 2px 6px rgba(23, 26, 43, 0.06);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding-inline: 16px;
        padding-block: 32px;
      }
      .wrap {
        width: 100%;
        max-width: 440px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      h1 {
        font-family: 'Fredoka', ui-rounded, system-ui, sans-serif;
        font-weight: 700;
        font-size: 30px;
        margin: 0;
        text-align: center;
      }
      p.sub {
        margin: -12px 0 0;
        text-align: center;
        color: var(--ink-dim);
        font-size: 14px;
      }
      .game-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .game-card {
        display: flex;
        align-items: center;
        gap: 14px;
        text-decoration: none;
        border-radius: 22px;
        padding: 18px;
        box-shadow: var(--shadow);
        color: #fff;
      }
      .game-pitchpop {
        background: linear-gradient(135deg, #4a7cf5, #7c3fc4);
      }
      .game-mathpop {
        background: linear-gradient(135deg, #38c07f, #4a7cf5);
      }
      .game-kachun {
        background: linear-gradient(135deg, #e98a2e, #d6473c);
      }
      .game-homediary {
        background: linear-gradient(135deg, #a8643a, #6b4226);
      }
      .game-icon {
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.22);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
      }
      .game-icon-logo {
        background: none;
        overflow: hidden;
        box-shadow: 0 2px 6px rgba(23, 26, 43, 0.18);
      }
      .game-icon-logo svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .game-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .game-title {
        font-family: 'Fredoka', ui-rounded, system-ui, sans-serif;
        font-weight: 700;
        font-size: 19px;
      }
      .game-sub {
        font-size: 13px;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>🧰 Marika's Apps</h1>
      <p class="sub">A few things I've built</p>
      <div class="game-list">
        <a class="game-card game-pitchpop" href="./pitchpop/">
          <span class="game-icon">🎵</span>
          <span class="game-text">
            <span class="game-title">PitchPop</span>
            <span class="game-sub">Learn perfect pitch by colored chords</span>
          </span>
        </a>
        <a class="game-card game-mathpop" href="./mathpop/">
          <span class="game-icon game-icon-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
              <defs>
                <linearGradient id="mp-bg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#38c07f"/>
                  <stop offset="1" stop-color="#4a7cf5"/>
                </linearGradient>
              </defs>
              <rect width="512" height="512" fill="url(#mp-bg)"/>
              <g stroke-linecap="round" stroke-width="28">
                <rect x="118" y="118" width="128" height="128" rx="34" fill="#fff"/>
                <rect x="266" y="118" width="128" height="128" rx="34" fill="#fff"/>
                <rect x="118" y="266" width="128" height="128" rx="34" fill="#ffd23f"/>
                <rect x="266" y="266" width="128" height="128" rx="34" fill="#fff"/>
                <path d="M182 146v72M146 182h72" stroke="#38c07f"/>
                <path d="M294 182h72" stroke="#3f9bc0"/>
                <path d="M157 305l50 50M207 305l-50 50" stroke="#171a2b"/>
                <path d="M294 330h72" stroke="#4a7cf5"/>
              </g>
              <circle cx="330" cy="298" r="14" fill="#4a7cf5"/>
              <circle cx="330" cy="362" r="14" fill="#4a7cf5"/>
            </svg>
          </span>
          <span class="game-text">
            <span class="game-title">MathPop</span>
            <span class="game-sub">Multiplication, addition, subtraction</span>
          </span>
        </a>
        <a class="game-card game-kachun" href="./kachun-quizer/">
          <span class="game-icon game-icon-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
              <defs>
                <linearGradient id="kq-bg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#e98a2e"/>
                  <stop offset="1" stop-color="#d6473c"/>
                </linearGradient>
              </defs>
              <rect width="512" height="512" fill="url(#kq-bg)"/>
              <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="30">
                <path d="M112 186v-46a28 28 0 0 1 28-28h46"/>
                <path d="M326 112h46a28 28 0 0 1 28 28v46"/>
                <path d="M400 326v46a28 28 0 0 1-28 28h-46"/>
                <path d="M186 400h-46a28 28 0 0 1-28-28v-46"/>
                <path d="M206 214a50 50 0 1 1 78 42c-18 12-28 22-28 44v6" stroke-width="36"/>
              </g>
              <circle cx="256" cy="362" r="23" fill="#fff"/>
              <path d="M346 166l7 17 17 7-17 7-7 17-7-17-17-7 17-7z" fill="#ffe08a"/>
            </svg>
          </span>
          <span class="game-text">
            <span class="game-title">Kachun Quizer</span>
            <span class="game-sub">Photo your notes, get quizzed on them</span>
          </span>
        </a>
        <a class="game-card game-homediary" href="https://homediary.onrender.com" target="_blank" rel="noopener noreferrer">
          <span class="game-icon game-icon-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
              <defs>
                <linearGradient id="hd-bg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#c47d4b"/>
                  <stop offset="1" stop-color="#8f5330"/>
                </linearGradient>
              </defs>
              <rect width="512" height="512" fill="url(#hd-bg)"/>
              <path d="M146 240v140a24 24 0 0 0 24 24h172a24 24 0 0 0 24-24V240L256 140z" fill="#fff8ee"/>
              <path d="M116 262L256 134l140 128" fill="none" stroke="#fff8ee" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
              <g stroke="#c9a88c" stroke-width="14" stroke-linecap="round">
                <path d="M186 290h96M186 330h96M186 370h64"/>
              </g>
              <path d="M306 232h36v108l-18-16-18 16z" fill="#b5453a"/>
            </svg>
          </span>
          <span class="game-text">
            <span class="game-title">HomeDiary</span>
            <span class="game-sub">Track your home's history and documents</span>
          </span>
        </a>
      </div>
    </div>
  </body>
</html>
